<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StallX Admin</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <h2>Admin Panel</h2>

  <!-- 🔘 NAV -->
  <div class="menu-actions">
    <button onclick="showSection('active')">Active Orders</button>
    <button onclick="showSection('completed')">Completed</button>
    <button onclick="showSection('logs')">Logs</button>
  </div>

  <div id="activeSection"></div>
  <div id="completedSection" style="display:none;"></div>
  <div id="logsSection" style="display:none;"></div>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script>

  // 🔁 SWITCH SECTIONS
  function showSection(section){

    document.getElementById("activeSection").style.display = "none"
    document.getElementById("completedSection").style.display = "none"
    document.getElementById("logsSection").style.display = "none"

    if(section === "active"){
      document.getElementById("activeSection").style.display = "block"
      loadActive()
    }
    else if(section === "completed"){
      document.getElementById("completedSection").style.display = "block"
      loadCompleted()
    }
    else{
      document.getElementById("logsSection").style.display = "block"
      loadLogs()
    }
  }

  // 🔥 ACTIVE ORDERS (SMART)
  function loadActive(){

    let container = document.getElementById("activeSection")
    container.innerHTML = ""

    let orders = JSON.parse(localStorage.getItem("orders")) || []

    let activeOrders = orders.filter(o => o.status !== "COMPLETED")

    if(activeOrders.length === 0){
      container.innerHTML = "<p>No active orders</p>"
      return
    }

    activeOrders.forEach(order => {

      let div = document.createElement("div")
      div.className = "food-card"

      // 🛡️ Safe items
      let items = (order.cart || [])
        .map(i => `${i.name} × ${i.qty}`)
        .join("<br>")

      // 🎯 SMART BUTTON SECTION
      let buttons = ""

      if(order.status === "QUEUE"){
        buttons = `
          <button class="cart-btn btn-start"
            onclick="updateStatus('${order.orderId}','PREPARING')">
            Start
          </button>
        `
      }
      else if(order.status === "PREPARING"){
        buttons = `
          <button class="cart-btn btn-ready"
            onclick="updateStatus('${order.orderId}','READY')">
            Ready
          </button>
        `
      }
      else if(order.status === "READY"){
        buttons = `
          <button class="cart-btn btn-verify"
            onclick="verifyOTP('${order.orderId}')">
            Verify OTP
          </button>
        `
      }

      // 🧾 CARD
      div.innerHTML = `
        <h3>${order.user?.name || "Unknown"}</h3>
        <p>${order.user?.phone || "-"}</p>
        <p>Token: ${order.token}</p>
        <p>Status: <span class="status-${order.status.toLowerCase()}">${order.status}</span></p>
        <p>${items}</p>

        ${buttons}
      `

      container.appendChild(div)
    })
  }

  // 🔄 UPDATE STATUS
  window.updateStatus = function(orderId, status){

    let orders = JSON.parse(localStorage.getItem("orders")) || []

    orders.forEach(o => {
      if(o.orderId === orderId){
        o.status = status
      }
    })

    localStorage.setItem("orders", JSON.stringify(orders))

    loadActive()
  }

  // 🔐 VERIFY OTP (SIMULATED)
  window.verifyOTP = function(orderId){

    let enteredOTP = prompt("Enter OTP from customer")

    if(!enteredOTP){
      alert("OTP required")
      return
    }

    // 🔥 TEMP (backend later)
    let correctOTP = "1234"

    if(enteredOTP !== correctOTP){
      alert("Invalid OTP")
      return
    }

    let orders = JSON.parse(localStorage.getItem("orders")) || []

    orders.forEach(o => {
      if(o.orderId === orderId){
        o.status = "COMPLETED"
      }
    })

    localStorage.setItem("orders", JSON.stringify(orders))

    alert("Order completed!")

    loadActive()
  }

  // ✅ COMPLETED
  function loadCompleted(){

    let container = document.getElementById("completedSection")
    container.innerHTML = ""

    let orders = JSON.parse(localStorage.getItem("orders")) || []

    let completed = orders.filter(o => o.status === "COMPLETED")

    completed.forEach(order => {

      let div = document.createElement("div")
      div.className = "food-card"

      div.innerHTML = `
        <h3>${order.user?.name}</h3>
        <p>Token: ${order.token}</p>
        <p>Completed</p>
      `

      container.appendChild(div)
    })
  }

  // 📊 LOGS
  function loadLogs(){

    let container = document.getElementById("logsSection")
    container.innerHTML = ""

    let orders = JSON.parse(localStorage.getItem("orders")) || []

    orders.forEach(order => {

      let div = document.createElement("div")
      div.className = "food-card"

      div.innerHTML = `
        <h3>${order.user?.name}</h3>
        <p>${order.user?.phone}</p>
        <p>Status: ${order.status}</p>
        <p>Token: ${order.token}</p>
      `

      container.appendChild(div)
    })
  }

  // 🔄 AUTO REFRESH
  setInterval(() => {
    loadActive()
  }, 3000)

  // DEFAULT
  showSection("active")

</script>

</body>
</html>
