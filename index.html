<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- 🔥 Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SmartX</title>

    <!-- 🎨 Global CSS -->
    <link rel="stylesheet" href="css/global.css" />
  </head>

  <body>
    <div class="container">
      <!-- 🔝 Navbar -->
      <div class="flex card">
        <h2>SmartX</h2>

        <button class="btn" onclick="goToCart()">
          🛒 <span id="cartCount">0</span>
        </button>
      </div>

      <!-- 🔐 Status Check Section -->
      <div class="card">
        <h3>Check Your Order Status</h3>

        <input id="phone" class="input" placeholder="Enter Phone Number" />

        <button class="btn" onclick="sendOTP()">Send OTP</button>

        <input id="otp" class="input" placeholder="Enter OTP" />

        <button class="btn" onclick="verifyAndGo()">Check Status</button>
      </div>

      <!-- 🔁 Mode Toggle -->
      <div class="card flex">
        <button class="btn" onclick="goUser()">User</button>
        <button class="btn" onclick="goAdmin()">Admin</button>
        <button class="btn" onclick="goDisplay()">Display</button>
      </div>
    </div>

    <!-- ⚙️ Core JS -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

    <!-- 📦 Homepage Logic (FINAL - No Changes Later) -->
    <script>
      let tempOTP = "";

      // 🛒 Cart Count Sync
      function updateCartCount() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").innerText = cart.length;
      }

      updateCartCount();

      // 🔐 Send OTP
      async function sendOTP() {
        let phone = document.getElementById("phone").value;

        if (!phone) {
          alert("Enter phone number");
          return;
        }

        tempOTP = Math.floor(1000 + Math.random() * 9000);

        alert("OTP: " + tempOTP); // simulate

        await API.sendOTP(phone);
      }

      // ✅ Verify + Redirect to Queue
      async function verifyAndGo() {
        let phone = document.getElementById("phone").value;
        let otp = document.getElementById("otp").value;

        if (!phone || !otp) {
          alert("Enter all details");
          return;
        }

        if (otp != tempOTP) {
          alert("Invalid OTP");
          return;
        }

        let verify = await API.verifyOTP(phone, otp);

        if (!verify.success) {
          alert("Verification failed");
          return;
        }

        let res = (await API.getUserOrder?.(phone)) || { orderId: "ORD1" };

        localStorage.setItem("orderId", res.orderId);

        navigate("queue.html");
      }

      // 🔁 Navigation Controls
      function goUser() {
        navigate("menu.html");
      }

      function goAdmin() {
        navigate("admin.html");
      }

      function goDisplay() {
        navigate("display.html");
      }

      function goToCart() {
        navigate("cart.html");
      }
    </script>
  </body>
</html>
