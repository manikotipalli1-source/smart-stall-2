<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StallX Confirmation</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container">
      <h2>Order Confirmed 🎉</h2>

      <!-- 🎟️ TOKEN DISPLAY -->
      <div class="card">
        <h3>Your Token Number</h3>
        <h1 id="token">--</h1>
      </div>

      <!-- ✅ SUCCESS MESSAGE -->
      <div class="card">
        <p>Your order has been placed successfully.</p>
        <p>Please wait for your turn.</p>
      </div>

      <!-- ACTION -->
      <div class="menu-actions">
        <button onclick="goQueue()">Go to Queue ➜</button>
      </div>
    </div>

    <!-- ⚙️ CORE JS -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

    <script>
      async function loadConfirmation() {
        let orderId = localStorage.getItem("orderId");

        console.log("ALL ORDERS:", orders);
        console.log("SEARCHING ID:", orderId);

        if (!orderId) {
          alert("Invalid access");
          navigate("index.html");
          return;
        }

        // 🔥 GET ALL ORDERS
        let orders = await API.getOrders();

        // 🔍 FIND THIS ORDER
        let order = orders.find((o) => o.orderId == orderId);

        if (!order) {
          console.log("Order not found!", orderId, orders);
          alert("Order not found");
          return;
        }

        if (!order) {
          alert("Order not found");
          return;
        }

        // 🎯 DISPLAY REAL DATA
        document.getElementById("tokenDisplay").innerText = order.token;
        document.getElementById("orderId").innerText = order.orderId;
        document.getElementById("phone").innerText = order.user.phone;
        document.getElementById("otp").innerText = order.otp;
      }

      loadConfirmation();

      function goQueue() {
        navigate("queue.html");
      }

      function goHome() {
        navigate("index.html");
      }
    </script>
  </body>
</html>
