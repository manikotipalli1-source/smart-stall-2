<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StallX Confirmation</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <h2>Order Confirmed 🎉</h2>

  <!-- 🎟️ TOKEN DISPLAY -->
  <div class="card">
    <h3>Your Token Number</h3>
    <h1 id="token">--</h1>
  </div>

  <!-- ✅ SUCCESS MESSAGE -->
  <div class="card">
    <p>Your order has been placed successfully.</p>
    <p>Please wait for your turn.</p>
  </div>

  <!-- ACTION -->
  <div class="menu-actions">
    <button onclick="goQueue()">Go to Queue ➜</button>
  </div>

</div>

<!-- ⚙️ CORE JS -->
<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script>

  let tokenNumber = ""

  async function initPage() {

    let user = JSON.parse(localStorage.getItem("user"))
    let cart = JSON.parse(localStorage.getItem("cart"))
    let paymentDone = localStorage.getItem("paymentDone")

    // 🚫 Security check
    if (!user || !cart || cart.length === 0 || !paymentDone) {
      alert("Invalid access. Please complete order properly.")
      navigate("cart.html")
      return
    }

    // 🎟️ Generate token
    let res = await API.generateToken()
    tokenNumber = res.token

    document.getElementById("token").innerText = tokenNumber

    // 📦 Create order
    let order = await API.placeOrder({
      user: user,
      cart: cart,
      token: tokenNumber,
      status: "QUEUE"
    })

    localStorage.setItem("orderId", order.orderId)

    // 🧹 Clear cart after order
    localStorage.setItem("cart", JSON.stringify([]))

    // ❌ Remove payment flag
    localStorage.removeItem("paymentDone")
  }

  initPage()

  // ➡️ GO TO QUEUE
  function goQueue() {
    navigate("queue.html")
  }

</script>

</body>
</html>
