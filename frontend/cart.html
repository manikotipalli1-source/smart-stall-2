<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StallX Cart</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <h2>Your Cart</h2>

  <!-- 🛒 CART ITEMS -->
  <div id="cartItems"></div>

  <!-- 💰 TOTAL -->
  <h3 id="totalPrice">Total: ₹0</h3>

  <!-- 👤 USER DETAILS -->
  <div class="card">

    <input id="name" class="input" placeholder="Enter Your Name">
    <input id="phone" class="input" placeholder="Enter Phone Number">

  </div>

  <!-- ACTION BUTTONS -->
  <div class="menu-actions">
    <button onclick="goBack()">⬅ Back</button>
    <button onclick="proceed()">Proceed to Payment ➜</button>
  </div>

</div>

<!-- ⚙️ CORE JS -->
<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script>

  // 🛒 INIT CART
  let cart = JSON.parse(localStorage.getItem("cart"))

  if (!cart || !Array.isArray(cart)) {
    cart = []
    localStorage.setItem("cart", JSON.stringify(cart))
  }

  // 📦 LOAD CART ITEMS
  function loadCart() {

    let container = document.getElementById("cartItems")
    container.innerHTML = ""

    let total = 0

    if (cart.length === 0) {
      container.innerHTML = "<p>Your cart is empty</p>"
      document.getElementById("totalPrice").innerText = "Total: ₹0"
      return
    }

    cart.forEach((item, index) => {

      total += item.price * item.qty

      let div = document.createElement("div")
      div.className = "food-card"

      div.innerHTML = `
        <h3>${item.name}</h3>
        <p>₹${item.price} × ${item.qty}</p>
        <button class="cart-btn" onclick="removeItem(${index})">
          Remove
        </button>
      `

      container.appendChild(div)
    })

    document.getElementById("totalPrice").innerText = "Total: ₹" + total
  }

  loadCart()

  // ❌ REMOVE ITEM
  function removeItem(index) {

    cart.splice(index, 1)

    localStorage.setItem("cart", JSON.stringify(cart))

    loadCart()
  }

  // 💳 PROCEED TO PAYMENT
  function proceed() {

    let name = document.getElementById("name").value
    let phone = document.getElementById("phone").value

    // ✅ Validation
    if (!name || !phone) {
      alert("Please enter name and phone")
      return
    }

    if (cart.length === 0) {
      alert("Cart is empty")
      return
    }

    // 💳 SIMULATED PAYMENT
    let confirmPayment = confirm("Proceed to payment?")

    if (!confirmPayment) return

    // 🟢 Payment success
    localStorage.setItem("paymentDone", "true")

    // 👤 Save user
    localStorage.setItem("user", JSON.stringify({
      name: name,
      phone: phone
    }))

    // ➡️ Go to confirmation page
    navigate("confirmation.html")
  }

  // 🔙 BACK
  function goBack() {
    navigate("menu.html")
  }

</script>

</body>
</html>
