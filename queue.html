<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StallX Queue</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <h2>Order Status</h2>

  <!-- 🎟️ TOKEN -->
  <div class="card">
    <h3>Your Token</h3>
    <h1 id="token">--</h1>
  </div>

  <!-- ⏳ STATUS -->
  <div class="card">
    <h3>Status</h3>
    <h2 id="status">Loading...</h2>
  </div>

  <!-- 🍽️ ITEMS -->
  <div class="card">
    <h3>Your Items</h3>
    <div id="items"></div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

<script>

  let orderId = localStorage.getItem("orderId")

  if (!orderId) {
    alert("No order found")
    navigate("index.html")
  }

  // 📦 LOAD ORDER
  async function loadOrder() {

    let orders = JSON.parse(localStorage.getItem("orders")) || []

    let order = orders.find(o => o.orderId === orderId)

    if (!order) {
      alert("Order not found")
      navigate("index.html")
      return
    }

    // 🎟️ Token
    document.getElementById("token").innerText = order.token

    // ⏳ Status
    let statusEl = document.getElementById("status")

statusEl.innerText = order.status

// remove old classes
statusEl.classList.remove("status-queue", "status-preparing", "status-ready")

// apply new class
if (order.status === "QUEUE") {
  statusEl.classList.add("status-queue")
}
else if (order.status === "PREPARING") {
  statusEl.classList.add("status-preparing")
}
else if (order.status === "READY") {
  statusEl.classList.add("status-ready")
}

    // 🍽️ Items
    let itemsDiv = document.getElementById("items")
    itemsDiv.innerHTML = ""

    order.cart.forEach(item => {

      let div = document.createElement("p")
      div.innerText = `${item.name} × ${item.qty}`

      itemsDiv.appendChild(div)
    })
  }

  loadOrder()

  // 🔄 AUTO REFRESH (every 3 sec)
  setInterval(loadOrder, 3000)

</script>

</body>
</html>
